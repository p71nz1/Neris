
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neris OS Pro</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Neris">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #f4f5f9;
            --card-bg: #ffffff;
            --primary: #c5a059;
            --primary-dark: #a38141;
            --text-main: #111827;
            --text-sub: #6b7280;
            --danger: #ef4444;
            --success: #10b981;
            --border: #e5e7eb;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        /* Dark Mode Theme */
        body.dark-mode {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        html, body {
            position: fixed; width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            display: flex; flex-direction: column; height: 100%; max-width: 500px;
            margin: 0 auto; position: relative; background: var(--bg);
        }

        /* Top Header Area */
        header {
            padding: calc(env(safe-area-inset-top) + 12px) 20px 12px 20px;
            background: var(--card-bg); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }

        header h1 { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: var(--primary); }

        .header-actions { display: flex; align-items: center; gap: 10px; }

        .theme-toggle {
            background: var(--bg); border: 1px solid var(--border); color: var(--text-main);
            width: 38px; height: 38px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
        }

        .badge-role {
            font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px;
            background: rgba(197, 160, 89, 0.15); color: var(--primary-dark);
        }

        main { flex: 1; overflow-y: auto; padding: 15px 15px 100px 15px; -webkit-overflow-scrolling: touch; }

        .card {
            background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px;
            margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border);
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }

        input, select {
            width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border);
            background: var(--bg); color: var(--text-main); font-size: 14px; outline: none; box-sizing: border-box;
        }

        .btn {
            width: 100%; padding: 14px; border-radius: var(--radius-md); border: none;
            background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
        }

        .btn-secondary { background: var(--bg); color: var(--text-main); border: 1px solid var(--border); margin-top: 8px; }

        /* File Upload Styling */
        .file-upload-box {
            border: 2px dashed var(--border); border-radius: var(--radius-md); padding: 15px;
            text-align: center; cursor: pointer; background: var(--bg); margin-bottom: 12px;
        }

        .preview-img { width: 100px; height: 100px; border-radius: 12px; object-fit: cover; margin-top: 10px; display: none; }

        /* Navigation Bar */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: calc(65px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
            background: var(--card-bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-sub); font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--primary); }

        /* Products Grid UI */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .prod-card {
            background: var(--card-bg); border-radius: var(--radius-lg); padding: 12px;
            border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between;
        }

        .prod-card img { width: 100%; height: 120px; border-radius: var(--radius-md); object-fit: cover; background: #eee; }
        .prod-title { font-size: 14px; font-weight: 700; margin-top: 8px; }
        .prod-price { color: var(--primary); font-weight: 800; font-size: 15px; margin-top: 2px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="app-container">

        <header>
            <h1>NERIS</h1>
            <div class="header-actions">
                <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
                <div class="badge-role" id="role-display">دخول</div>
            </div>
        </header>

        <!-- Auth Section -->
        <div id="view-auth" style="padding: 20px;">
            <div class="card" id="form-login">
                <h2 style="text-align: center; margin-bottom: 15px; color: var(--primary);">تسجيل الدخول</h2>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="login-email"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="login-pass"></div>
                
                <button class="btn" onclick="handleLogin()">دخول للنظام</button>
                <button class="btn btn-secondary" onclick="toggleAuthForm('register')">إنشاء حساب جديد</button>
                <button style="background:none; border:none; color:var(--text-sub); font-size:12px; margin-top:10px; width:100%; text-align:center;" onclick="handleForgotPassword()">نسيت كلمة المرور؟</button>
            </div>

            <div class="card" id="form-register" style="display: none;">
                <h2 style="text-align: center; margin-bottom: 15px; color: var(--primary);">حساب جديد</h2>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="reg-email"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="reg-pass"></div>
                <div class="form-group">
                    <label>نوع الحساب</label>
                    <select id="reg-role">
                        <option value="staff">موظف (Staff)</option>
                        <option value="owner">مالك (Owner)</option>
                    </select>
                </div>
                <button class="btn" onclick="handleRegister()">إنشاء الحساب</button>
                <button class="btn btn-secondary" onclick="toggleAuthForm('login')">إلغاء</button>
            </div>
        </div>

        <!-- App View -->
        <main id="view-app" style="display: none;">

            <!-- TAB 1: Inventory -->
            <div id="tab-inventory" class="tab-content active">
                <div class="form-group">
                    <input type="text" id="search-input" placeholder="🔍 ابحث في المنتجات..." oninput="filterProducts()">
                </div>
                <div class="products-grid" id="products-list"></div>
            </div>

            <!-- TAB 2: Pricing & Add Products (Owner Only) -->
            <div id="tab-calc" class="tab-content owner-only">
                <div class="card">
                    <h3 style="margin-bottom: 12px; color: var(--primary);">إضافة منتج وتحديد السعر الذكي</h3>
                    
                    <div class="form-group"><label>اسم المنتج</label><input type="text" id="c-name"></div>
                    
                    <div class="file-upload-box" onclick="document.getElementById('c-file').click()">
                        <span style="font-size: 13px; color: var(--text-sub);">📸 اضغط هنا لاختيار صورة من الجوال</span>
                        <input type="file" id="c-file" accept="image/*" style="display: none;" onchange="previewImage(event)">
                        <br><img id="img-preview" class="preview-img">
                    </div>

                    <div style="display: flex; gap: 8px;">
                        <div class="form-group" style="flex: 1;"><label>تكلفة القطعة</label><input type="number" id="c-item" oninput="calcPrice()"></div>
                        <div class="form-group" style="flex: 1;"><label>سعر الباكج</label><input type="number" id="c-pkg" value="5" oninput="calcPrice()"></div>
                        <div class="form-group" style="flex: 1;"><label>سعر الكيس</label><input type="number" id="c-bag" value="3" oninput="calcPrice()"></div>
                    </div>

                    <div class="form-group"><label>الكمية بالمخزن</label><input type="number" id="c-qty" value="1"></div>

                    <div style="background: rgba(16, 185, 129, 0.1); padding: 12px; border-radius: 10px; font-size: 13px; color: var(--success); margin-bottom: 12px;" id="price-result">
                        أدخل التكاليف لحساب السعر تلقائياً.
                    </div>

                    <div class="form-group"><label>سعر البيع النهائي للعميل (ر.س)</label><input type="number" id="c-final"></div>
                    <button class="btn" onclick="saveProduct()">حفظ المنتج في المخزن</button>
                </div>
            </div>

            <!-- TAB 3: Sales -->
            <div id="tab-sales" class="tab-content">
                <div id="pos-products-list"></div>
            </div>

            <button class="btn btn-secondary" style="margin-top: 20px; color: var(--danger);" onclick="handleLogout()">تسجيل الخروج</button>
        </main>

        <!-- Navigation Bar -->
        <nav class="bottom-nav" id="app-nav" style="display: none;">
            <button class="nav-item active" onclick="switchTab('inventory', this)">
                <span style="font-size:18px">📦</span><span>المخزن</span>
            </button>
            <button class="nav-item owner-only" onclick="switchTab('calc', this)">
                <span style="font-size:18px">🏷️</span><span>التسعير والمنتجات</span>
            </button>
            <button class="nav-item" onclick="switchTab('sales', this)">
                <span style="font-size:18px">💰</span><span>المبيعات</span>
            </button>
        </nav>

    </div>

    <script>
        // === بيانات Firebase الخاصة بك ===
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userRole = 'staff';
        let base64Image = 'https://via.placeholder.com/150?text=Neris';
        let allProductsCache = [];

        // Theme Switcher
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('neris_theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('neris_theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-btn').innerText = '☀️';
        }

        // Image Selection Handler (Direct File Upload)
        function previewImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    base64Image = evt.target.result;
                    const imgEl = document.getElementById('img-preview');
                    imgEl.src = base64Image;
                    imgEl.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("users").doc(user.uid).get().then(doc => {
                    if (doc.exists) userRole = doc.data().role || 'staff';
                    setupUI();
                });
            } else {
                document.getElementById('view-auth').style.display = 'block';
                document.getElementById('view-app').style.display = 'none';
                document.getElementById('app-nav').style.display = 'none';
                document.getElementById('role-display').innerText = 'دخول';
            }
        });

        function toggleAuthForm(type) {
            document.getElementById('form-login').style.display = type === 'login' ? 'block' : 'none';
            document.getElementById('form-register').style.display = type === 'register' ? 'block' : 'none';
        }

        function handleLogin() {
            const e = document.getElementById('login-email').value.trim();
            const p = document.getElementById('login-pass').value;
            if (!e || !p) return alert('أدخل البيانات بشكل صحيح');
            auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        function handleRegister() {
            const e = document.getElementById('reg-email').value.trim();
            const p = document.getElementById('reg-pass').value;
            const role = document.getElementById('reg-role').value;
            auth.createUserWithEmailAndPassword(e, p).then(res => {
                db.collection("users").doc(res.user.uid).set({ email: e, role });
            }).catch(err => alert(err.message));
        }

        function handleForgotPassword() {
            const email = prompt('أدخل إيميلك لإرسال رابط تعيين كلمة المرور:');
            if (email) auth.sendPasswordResetEmail(email).then(() => alert('تم الإرسال على بريدك!'));
        }

        function handleLogout() { auth.signOut(); }

        function setupUI() {
            document.getElementById('view-auth').style.display = 'none';
            document.getElementById('view-app').style.display = 'block';
            document.getElementById('app-nav').style.display = 'flex';
            document.getElementById('role-display').innerText = userRole === 'owner' ? 'المالك 👑' : 'موظف 💼';

            if (userRole !== 'owner') {
                document.querySelectorAll('.owner-only').forEach(el => el.style.display = 'none');
            } else {
                document.querySelectorAll('.owner-only').forEach(el => el.style.display = 'flex');
            }
            listenProducts();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function calcPrice() {
            const item = parseFloat(document.getElementById('c-item').value) || 0;
            const pkg = parseFloat(document.getElementById('c-pkg').value) || 0;
            const bag = parseFloat(document.getElementById('c-bag').value) || 0;

            const total = item + pkg + bag;
            const suggested = Math.round(total * 2.1);

            document.getElementById('price-result').innerHTML = `إجمالي التكلفة: <b>${total} ر.س</b> | السعر الموصى به: <b>${suggested} ر.س</b>`;
            document.getElementById('c-final').value = suggested;
        }

        function saveProduct() {
            const name = document.getElementById('c-name').value;
            const itemCost = parseFloat(document.getElementById('c-item').value) || 0;
            const pkgCost = parseFloat(document.getElementById('c-pkg').value) || 0;
            const bagCost = parseFloat(document.getElementById('c-bag').value) || 0;
            const price = parseFloat(document.getElementById('c-final').value) || 0;
            const qty = parseInt(document.getElementById('c-qty').value) || 0;

            if (!name) return alert('أدخل اسم المنتج');

            db.collection("products").add({
                name, itemCost, pkgCost, bagCost,
                totalCost: itemCost + pkgCost + bagCost,
                price, qty, img: base64Image, createdAt: new Date()
            }).then(() => {
                alert('تم إضافة المنتج بنجاح في المخزن!');
                switchTab('inventory');
            });
        }

        function listenProducts() {
            db.collection("products").onSnapshot(snap => {
                allProductsCache = [];
                snap.forEach(doc => allProductsCache.push({ id: doc.id, ...doc.data() }));
                renderProducts(allProductsCache);
            });
        }

        function renderProducts(list) {
            const inv = document.getElementById('products-list');
            const pos = document.getElementById('pos-products-list');
            inv.innerHTML = ''; pos.innerHTML = '';

            list.forEach(p => {
                const costUI = userRole === 'owner' ? `<div style="font-size:11px; color:var(--danger)">التكلفة: ${p.totalCost || 0} ر.س</div>` : '';

                inv.innerHTML += `
                    <div class="prod-card">
                        <img src="${p.img}">
                        <div class="prod-title">${p.name}</div>
                        <div class="prod-price">${p.price} ر.س</div>
                        ${costUI}
                        <div style="font-size:11px; color:var(--text-sub); margin-top:4px;">المتبقي: ${p.qty}</div>
                    </div>
                `;

                pos.innerHTML += `
                    <div class="card" style="display:flex; align-items:center; justify-content:space-between; padding:12px;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <img src="${p.img}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                            <div>
                                <div style="font-weight:700">${p.name}</div>
                                <div style="color:var(--primary); font-weight:800; font-size:13px">${p.price} ر.س (المتبقي: ${p.qty})</div>
                            </div>
                        </div>
                        <button class="btn" style="width:auto; padding:8px 12px; font-size:12px;" onclick="sell('${p.id}', ${p.qty})">تسجيل بيع</button>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProductsCache.filter(p => p.name.toLowerCase().includes(q));
            renderProducts(filtered);
        }

        function sell(id, currentQty) {
            if (currentQty <= 0) return alert('نفد المنتج من المخزن');
            db.collection("products").doc(id).update({ qty: currentQty - 1 });
        }
    </script>
</body>
</html>
