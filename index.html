
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neris OS</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Neris">

    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #faf8f5;
            --card-bg: #ffffff;
            --primary: #c5a059;
            --primary-dark: #9e7d3b;
            --text-main: #1a1a1a;
            --text-sub: #8e8e93;
            --danger: #ff3b30;
            --border: #e5e5ea;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            background: var(--bg);
        }

        header {
            padding: calc(env(safe-area-inset-top) + 15px) 20px 15px 20px;
            background: rgba(250, 248, 245, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        header h1 { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: var(--primary); }

        .badge-role {
            font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
            background: #f0ece1; color: var(--primary-dark);
        }

        main { flex: 1; overflow-y: auto; padding: 15px 20px 100px 20px; -webkit-overflow-scrolling: touch; }

        .card {
            background: var(--card-bg); border-radius: var(--radius-lg); padding: 20px;
            margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); border: 0.5px solid rgba(0,0,0,0.04);
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }

        input, select {
            width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
            background: #fdfdfd; font-size: 15px; outline: none; box-sizing: border-box;
        }

        .btn {
            width: 100%; padding: 14px; border-radius: var(--radius-md); border: none;
            background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 5px;
        }

        .btn-secondary { background: #eee; color: var(--text-main); margin-top: 8px; }
        .btn-link { background: none; color: var(--primary-dark); font-size: 13px; font-weight: 600; text-align: center; width: 100%; margin-top: 10px; cursor: pointer; border: none; }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: calc(65px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(25px); border-top: 0.5px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-sub); font-size: 10px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }

        .prod-card { display: flex; align-items: center; gap: 12px; background: var(--card-bg); padding: 12px; border-radius: var(--radius-md); margin-bottom: 10px; }
        .prod-img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; background: #f0f0f0; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="app-container">

        <header>
            <h1>NERIS</h1>
            <div class="badge-role" id="role-display">تسجيل الدخول</div>
        </header>

        <!-- Auth Section -->
        <div id="view-auth" style="padding: 20px;">
            <!-- Login Form -->
            <div class="card" id="form-login">
                <h2 style="text-align: center; margin-bottom: 15px; color: var(--primary);">تسجيل الدخول</h2>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="login-email" placeholder="name@neris.com"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="login-pass"></div>
                
                <button class="btn" onclick="handleLogin()">دخول للنظام</button>
                <button class="btn btn-secondary" onclick="toggleAuthForm('register')">إنشاء حساب جديد</button>
                <button class="btn-link" onclick="handleForgotPassword()">نسيت كلمة المرور؟</button>
            </div>

            <!-- Register Form -->
            <div class="card" id="form-register" style="display: none;">
                <h2 style="text-align: center; margin-bottom: 15px; color: var(--primary);">حساب جديد</h2>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="reg-email"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="reg-pass"></div>
                <div class="form-group">
                    <label>نوع الحساب</label>
                    <select id="reg-role">
                        <option value="staff">موظف (Staff)</option>
                        <option value="owner">مالك (Owner)</option>
                    </select>
                </div>
                <button class="btn" onclick="handleRegister()">إنشاء الحساب</button>
                <button class="btn btn-secondary" onclick="toggleAuthForm('login')">العودة لتسجيل الدخول</button>
            </div>
        </div>

        <!-- App View -->
        <main id="view-app" style="display: none;">

            <!-- TAB: Inventory -->
            <div id="tab-inventory" class="tab-content active">
                <div style="font-weight: 800; font-size: 18px; margin-bottom: 12px;">المخزون الحالي</div>
                <div id="products-list"></div>
            </div>

            <!-- TAB: Smart Calc (Owner Only) -->
            <div id="tab-calc" class="tab-content owner-only">
                <div class="card">
                    <div style="font-weight: 800; font-size: 16px; margin-bottom: 12px;">حاسبة التسعير والتكاليف</div>
                    <div class="form-group"><label>اسم المنتج</label><input type="text" id="c-name"></div>
                    <div class="form-group"><label>تكلفة القطعة (ر.س)</label><input type="number" id="c-item" oninput="calcPrice()"></div>
                    <div class="form-group"><label>تكلفة العلبة / الباكج (ر.س)</label><input type="number" id="c-pkg" value="5" oninput="calcPrice()"></div>
                    <div class="form-group"><label>تكلفة الكيس (ر.س)</label><input type="number" id="c-bag" value="3" oninput="calcPrice()"></div>
                    <div class="form-group"><label>الكمية المتوفرة</label><input type="number" id="c-qty" value="1"></div>
                    <div class="form-group"><label>رابط الصورة</label><input type="text" id="c-img"></div>
                    
                    <div style="background: #f0f7f4; padding: 12px; border-radius: 10px; font-size: 13px; color: #2ecc71; margin-bottom: 12px;" id="price-result">
                        أدخل التكاليف لحساب السعر تلقائياً.
                    </div>

                    <div class="form-group"><label>سعر البيع النهائي (ر.س)</label><input type="number" id="c-final"></div>
                    <button class="btn" onclick="saveProduct()">حفظ المنتج</button>
                </div>
            </div>

            <!-- TAB: Sales -->
            <div id="tab-sales" class="tab-content">
                <div style="font-weight: 800; font-size: 18px; margin-bottom: 12px;">تسجيل المبيعات</div>
                <div id="pos-products-list"></div>
            </div>

            <button class="btn btn-secondary" style="margin-top: 20px; background: #ffebeb; color: var(--danger);" onclick="handleLogout()">تسجيل الخروج</button>
        </main>

        <!-- Navigation Bar -->
        <nav class="bottom-nav" id="app-nav" style="display: none;">
            <button class="nav-item active" onclick="switchTab('inventory', this)">
                <span style="font-size:18px">📦</span><span>المخزن</span>
            </button>
            <button class="nav-item owner-only" onclick="switchTab('calc', this)">
                <span style="font-size:18px">🧮</span><span>الحاسبة</span>
            </button>
            <button class="nav-item" onclick="switchTab('sales', this)">
                <span style="font-size:18px">💰</span><span>المبيعات</span>
            </button>
        </nav>

    </div>

    <script>
        // === بيانات Firebase الخاصة بمشروعك Neris ===
        const firebaseConfig = {
            apiKey: "AIzaSyA1wNdm1DWWn3z8K-dfwrjk__1-hwmTx-U",
            authDomain: "neris-ba7c5.firebaseapp.com",
            projectId: "neris-ba7c5",
            storageBucket: "neris-ba7c5.firebasestorage.app",
            messagingSenderId: "852124332521",
            appId: "1:852124332521:web:f24a586437163651855b78",
            measurementId: "G-EENL3EYEVM"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userRole = 'staff';

        // التحقق من حالة الدخول
        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("users").doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        userRole = doc.data().role || 'staff';
                    }
                    setupUI();
                });
            } else {
                document.getElementById('view-auth').style.display = 'block';
                document.getElementById('view-app').style.display = 'none';
                document.getElementById('app-nav').style.display = 'none';
                document.getElementById('role-display').innerText = 'تسجيل الدخول';
            }
        });

        function toggleAuthForm(type) {
            document.getElementById('form-login').style.display = type === 'login' ? 'block' : 'none';
            document.getElementById('form-register').style.display = type === 'register' ? 'block' : 'none';
        }

        // تسجيل الدخول
        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;

            if (!email || !pass) return alert('الرجاء إدخال البريد وكلمة المرور');

            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => alert('خطأ في تسجيل الدخول: ' + err.message));
        }

        // إنشاء حساب جديد
        function handleRegister() {
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const role = document.getElementById('reg-role').value;

            if (!email || !pass) return alert('يرجى تعبئة جميع الحقول');

            auth.createUserWithEmailAndPassword(email, pass)
                .then(res => {
                    db.collection("users").doc(res.user.uid).set({ email, role });
                    alert('تم إنشاء الحساب بنجاح!');
                })
                .catch(err => alert('خطأ في إنشاء الحساب: ' + err.message));
        }

        // نسيت كلمة المرور (إرسال إيميل رسمياً)
        function handleForgotPassword() {
            const email = prompt('أدخل إيميلك لإرسال رابط إعادة تعيين كلمة المرور:');
            if (email) {
                auth.sendPasswordResetEmail(email)
                    .then(() => alert('تم إرسال رابط إعادة تعيين كلمة المرور إلى إيميلك بنجاح! تفقد البريد الوارد.'))
                    .catch(err => alert('خطأ: ' + err.message));
            }
        }

        function handleLogout() {
            auth.signOut();
        }

        function setupUI() {
            document.getElementById('view-auth').style.display = 'none';
            document.getElementById('view-app').style.display = 'block';
            document.getElementById('app-nav').style.display = 'flex';

            document.getElementById('role-display').innerText = userRole === 'owner' ? 'المالك 👑' : 'موظف 💼';

            if (userRole !== 'owner') {
                document.querySelectorAll('.owner-only').forEach(el => el.style.display = 'none');
            } else {
                document.querySelectorAll('.owner-only').forEach(el => el.style.display = 'flex');
            }

            listenProducts();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function calcPrice() {
            const item = parseFloat(document.getElementById('c-item').value) || 0;
            const pkg = parseFloat(document.getElementById('c-pkg').value) || 0;
            const bag = parseFloat(document.getElementById('c-bag').value) || 0;

            const total = item + pkg + bag;
            const suggested = Math.round(total * 2.1);

            document.getElementById('price-result').innerHTML = `إجمالي التكلفة: <b>${total} ر.س</b> | السعر المقترح: <b>${suggested} ر.س</b>`;
            document.getElementById('c-final').value = suggested;
        }

        function saveProduct() {
            const name = document.getElementById('c-name').value;
            const itemCost = parseFloat(document.getElementById('c-item').value) || 0;
            const pkgCost = parseFloat(document.getElementById('c-pkg').value) || 0;
            const bagCost = parseFloat(document.getElementById('c-bag').value) || 0;
            const price = parseFloat(document.getElementById('c-final').value) || 0;
            const qty = parseInt(document.getElementById('c-qty').value) || 0;
            const img = document.getElementById('c-img').value || 'https://via.placeholder.com/60?text=Neris';

            db.collection("products").add({
                name, itemCost, pkgCost, bagCost,
                totalCost: itemCost + pkgCost + bagCost,
                price, qty, img, createdAt: new Date()
            }).then(() => {
                alert('تم التخزين بنجاح');
                switchTab('inventory');
            });
        }

        function listenProducts() {
            db.collection("products").onSnapshot(snap => {
                const inv = document.getElementById('products-list');
                const pos = document.getElementById('pos-products-list');
                inv.innerHTML = ''; pos.innerHTML = '';

                snap.forEach(doc => {
                    const p = { id: doc.id, ...doc.data() };
                    const costUI = userRole === 'owner' ? `<div style="font-size:11px; color:var(--danger)">التكلفة: ${p.totalCost || 0} ر.س</div>` : '';

                    inv.innerHTML += `
                        <div class="prod-card">
                            <img src="${p.img}" class="prod-img">
                            <div style="flex:1">
                                <div style="font-weight:700">${p.name}</div>
                                <div style="color:var(--primary-dark); font-weight:700; font-size:13px">${p.price} ر.س</div>
                                ${costUI}
                                <div style="font-size:12px; color:var(--text-sub)">المتبقي: ${p.qty}</div>
                            </div>
                        </div>
                    `;

                    pos.innerHTML += `
                        <div class="prod-card">
                            <img src="${p.img}" class="prod-img">
                            <div style="flex:1">
                                <div style="font-weight:700">${p.name}</div>
                                <div style="color:var(--primary-dark); font-weight:700; font-size:13px">${p.price} ر.س</div>
                            </div>
                            <button class="btn" style="width:auto; padding:8px 14px; font-size:12px;" onclick="sell('${p.id}', ${p.qty})">تسجيل بيع</button>
                        </div>
                    `;
                });
            });
        }

        function sell(id, currentQty) {
            if (currentQty <= 0) return alert('نفد المنتج');
            db.collection("products").doc(id).update({ qty: currentQty - 1 });
        }
    </script>
</body>
</html>
