
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neris - Enterprise OS</title>

    <!-- PWA App Icons & Theme -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Neris">
    <meta name="theme-color" content="#2c4c47">
    
    <!-- SVG Data URI App Icon based on Neris Logo -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500' width='180' height='180'><rect width='500' height='500' fill='%232c4c47'/><path d='M250,180 C270,220 310,230 330,200 C310,250 270,270 250,270 C230,270 190,250 170,200 C190,230 230,220 250,180 Z' fill='none' stroke='%23d4af37' stroke-width='12'/><path d='M250,150 C280,200 340,210 370,170 C340,240 280,290 250,290 C220,290 160,240 130,170 C160,210 220,200 250,150 Z' fill='none' stroke='%23d4af37' stroke-width='10'/><text x='250' y='360' font-family='sans-serif' font-size='42' font-weight='bold' fill='%23ffffff' text-anchor='middle' letter-spacing='8'>NERIS</text></svg>">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-body: #0d1414;
            --surface: #162221;
            --surface-sub: #1e2e2c;
            --primary: #d4af37;
            --primary-hover: #b89628;
            --primary-light: rgba(212, 175, 55, 0.15);
            --brand-green: #2c4c47;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #273b38;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --success: #10b981;
            --warning: #f59e0b;
            --shadow-lg: 0 20px 30px -10px rgba(0, 0, 0, 0.6);
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
        }

        body.light-mode {
            --bg-body: #f4f7f6;
            --surface: #ffffff;
            --surface-sub: #e8f0ee;
            --text-main: #0f172a;
            --text-muted: #526360;
            --border: #d0deda;
            --shadow-lg: 0 15px 25px -5px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-body); color: var(--text-main);
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed; inset: 0; background: var(--brand-green);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }

        .splash-logo-container { text-align: center; }
        .splash-icon { width: 100px; height: 100px; margin-bottom: 15px; animation: pulse 2s infinite; }
        .splash-title { font-size: 32px; font-weight: 900; letter-spacing: 8px; color: #ffffff; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.96); opacity: 0.85; }
            50% { transform: scale(1.04); opacity: 1; }
        }

        .app-shell {
            display: flex; flex-direction: column; height: 100%; max-width: 480px;
            margin: 0 auto; position: relative; background: var(--bg-body);
        }

        header {
            padding: calc(env(safe-area-inset-top) + 12px) 20px 12px 20px;
            background: rgba(22, 34, 33, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }

        .brand-header { display: flex; align-items: center; gap: 10px; }
        .brand-header svg { width: 28px; height: 28px; }
        .brand-logo-text { font-size: 20px; font-weight: 900; letter-spacing: 4px; color: var(--primary); }

        .icon-btn {
            background: var(--surface-sub); border: 1px solid var(--border); color: var(--text-main);
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 15px; cursor: pointer;
        }

        .user-badge {
            font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 20px;
            background: var(--primary-light); color: var(--primary); border: 1px solid rgba(212, 175, 55, 0.3);
        }

        main { flex: 1; overflow-y: auto; padding: 20px 16px 100px 16px; -webkit-overflow-scrolling: touch; }

        .card {
            background: var(--surface); border-radius: var(--radius-xl); padding: 22px;
            margin-bottom: 16px; box-shadow: var(--shadow-lg); border: 1px solid var(--border);
        }

        .card-header-icon { text-align: center; margin-bottom: 12px; }
        .card-header-icon svg { width: 50px; height: 50px; }

        .card-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; text-align: center; }
        .card-subtitle { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 18px; }

        .form-group { margin-bottom: 14px; position: relative; }
        label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }

        input, select {
            width: 100%; padding: 13px 15px; border-radius: var(--radius-md); border: 1px solid var(--border);
            background: var(--surface-sub); color: var(--text-main); font-size: 14px; font-weight: 600; outline: none;
        }

        .pwd-container { position: relative; }
        .toggle-pwd-btn {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer;
        }

        .btn {
            width: 100%; padding: 14px; border-radius: var(--radius-md); border: none;
            background: var(--primary); color: #0d1414; font-size: 15px; font-weight: 800;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
        }

        .btn-subtle { background: var(--surface-sub); color: var(--text-main); border: 1px solid var(--border); box-shadow: none; margin-top: 8px; }
        .btn-text { background: none; border: none; color: var(--primary); font-size: 12px; font-weight: 700; width: 100%; padding: 8px; cursor: pointer; margin-top: 4px; }

        .alert-box {
            padding: 12px 14px; border-radius: var(--radius-md); font-size: 13px; font-weight: 700;
            margin-bottom: 14px; display: none; text-align: center; line-height: 1.4;
        }
        .alert-box.error { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .alert-box.success { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

        .user-item {
            display: flex; flex-direction: column; gap: 8px; padding: 14px;
            background: var(--surface-sub); border: 1px solid var(--border);
            border-radius: var(--radius-lg); margin-bottom: 10px;
        }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: calc(65px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
            background: var(--surface); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }

        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; cursor: pointer; flex: 1; }
        .nav-btn.active { color: var(--primary); }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN WITH NERIS LOGO -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <svg class="splash-icon" viewBox="0 0 100 100">
                <path d="M50,30 C58,45 70,50 80,40 C70,60 58,70 50,70 C42,70 30,60 20,40 C30,50 42,45 50,30 Z" fill="none" stroke="#d4af37" stroke-width="4"/>
                <path d="M50,20 C60,40 80,45 90,30 C80,60 65,80 50,80 C35,80 20,60 10,30 C20,45 40,40 50,20 Z" fill="none" stroke="#d4af37" stroke-width="3"/>
            </svg>
            <div class="splash-title">NERIS</div>
        </div>
    </div>

    <div class="app-shell">

        <header>
            <div class="brand-header">
                <svg viewBox="0 0 100 100">
                    <path d="M50,30 C58,45 70,50 80,40 C70,60 58,70 50,70 C42,70 30,60 20,40 C30,50 42,45 50,30 Z" fill="none" stroke="#d4af37" stroke-width="5"/>
                </svg>
                <div class="brand-logo-text">NERIS</div>
            </div>
            <div class="header-controls">
                <button class="icon-btn" onclick="toggleAppTheme()" id="theme-icon">☀️</button>
                <div class="user-badge" id="role-badge">تسجيل الدخول</div>
            </div>
        </header>

        <!-- AUTHENTICATION CONTAINER -->
        <div id="auth-container" style="padding: 20px 16px;">
            <div class="alert-box error" id="auth-error"></div>
            <div class="alert-box success" id="auth-success"></div>

            <!-- LOGIN CARD -->
            <div class="card" id="card-login">
                <div class="card-header-icon">
                    <svg viewBox="0 0 100 100">
                        <path d="M50,30 C58,45 70,50 80,40 C70,60 58,70 50,70 C42,70 30,60 20,40 C30,50 42,45 50,30 Z" fill="none" stroke="#d4af37" stroke-width="4"/>
                    </svg>
                </div>
                <div class="card-title">تسجيل الدخول</div>
                <div class="card-subtitle">منظومة إدارة Neris الاحترافية</div>

                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="login-email" placeholder="user@neris.com"></div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="pwd-container">
                        <input type="password" id="login-pass" placeholder="••••••••">
                        <button class="toggle-pwd-btn" type="button" onclick="togglePasswordVisibility('login-pass', this)">👁️</button>
                    </div>
                </div>
                <button class="btn" onclick="execLoginEmail()">دخول النظام</button>
                <button class="btn btn-subtle" onclick="switchAuthCard('register')">إنشاء حساب جديد</button>
                <button class="btn-text" onclick="switchAuthCard('reset')">نسيت كلمة المرور؟</button>
            </div>

            <!-- REGISTER CARD -->
            <div class="card" id="card-register" style="display: none;">
                <div class="card-title">إنشاء حساب جديد</div>
                <div class="card-subtitle">أدخل بيانات الحساب وحدد الدور المباشر</div>

                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="reg-email" placeholder="user@neris.com"></div>
                
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="pwd-container">
                        <input type="password" id="reg-pass" placeholder="6 أرقام/أحرف على الأقل">
                        <button class="toggle-pwd-btn" type="button" onclick="togglePasswordVisibility('reg-pass', this)">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <div class="pwd-container">
                        <input type="password" id="reg-pass-confirm" placeholder="أعد كتابة كلمة المرور">
                        <button class="toggle-pwd-btn" type="button" onclick="togglePasswordVisibility('reg-pass-confirm', this)">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>نوع الحساب والصلاحية</label>
                    <select id="reg-role">
                        <option value="staff">موظف</option>
                        <option value="admin">مشرف</option>
                        <option value="owner">مالك</option>
                    </select>
                </div>

                <button class="btn" onclick="execRegister()">إنشاء الحساب وإرسال رمز التوثيق</button>
                <button class="btn btn-subtle" onclick="switchAuthCard('login')">العودة لتسجيل الدخول</button>
            </div>

            <!-- RESET CARD -->
            <div class="card" id="card-reset" style="display: none;">
                <div class="card-title">استعادة كلمة المرور</div>
                <div class="card-subtitle">أدخل البريد الإلكتروني لإرسال رابط إعادة التعيين</div>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="reset-email" placeholder="user@neris.com"></div>
                <button class="btn" onclick="execResetPassword()">إرسال الرابط</button>
                <button class="btn btn-subtle" onclick="switchAuthCard('login')">العودة لتسجيل الدخول</button>
            </div>
        </div>

        <!-- MAIN APP -->
        <main id="app-container" style="display: none;">
            <div id="panel-team" class="card">
                <div class="card-title" style="text-align: right; margin-bottom: 14px;">إدارة فريق العمل والصلاحيات</div>
                <div id="users-presence-list"></div>
            </div>
            
            <button class="btn btn-subtle" style="color: var(--danger);" onclick="execLogout()">تسجيل الخروج</button>
        </main>

        <nav class="bottom-nav" id="app-nav" style="display: none;">
            <button class="nav-btn active">
                <span style="font-size:18px">👥</span><span>الكادر والشغارات</span>
            </button>
        </nav>

    </div>

    <script>
        // =========================================================================
        // IMPORTANT: ضع بيانات مشروع Firebase الخاص بك هنا لكي يختفي الخطأ الأحمر
        // =========================================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentUserRole = 'staff';

        // SPLASH SCREEN REMOVAL
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 1000);
        });

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = '🔒';
            } else {
                input.type = 'password';
                btn.innerText = '👁️';
            }
        }

        function toggleAppTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('theme-icon').innerText = isLight ? '🌙' : '☀️';
        }

        function switchAuthCard(cardType) {
            hideAlerts();
            document.getElementById('card-login').style.display = cardType === 'login' ? 'block' : 'none';
            document.getElementById('card-register').style.display = cardType === 'register' ? 'block' : 'none';
            document.getElementById('card-reset').style.display = cardType === 'reset' ? 'block' : 'none';
        }

        function showAlert(msg, isError = true) {
            const errBox = document.getElementById('auth-error');
            const succBox = document.getElementById('auth-success');
            hideAlerts();
            if (isError) { errBox.innerText = msg; errBox.style.display = 'block'; }
            else { succBox.innerText = msg; succBox.style.display = 'block'; }
        }

        function hideAlerts() {
            document.getElementById('auth-error').style.display = 'none';
            document.getElementById('auth-success').style.display = 'none';
        }

        function execLoginEmail() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            if (!email || !pass) return showAlert('يرجى كتابة البريد الإلكتروني وكلمة المرور');

            auth.signInWithEmailAndPassword(email, pass).then(res => {
                if (!res.user.emailVerified) {
                    showAlert('يرجى تأكيد حسابك من خلال رابط التوثيق المرفق برسالك في البريد الإلكتروني أولاً.');
                }
            }).catch(err => showAlert(err.message));
        }

        function execRegister() {
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const passConfirm = document.getElementById('reg-pass-confirm').value;
            const role = document.getElementById('reg-role').value;

            if (!email || !pass) return showAlert('يرجى إكمال جميع الحقول');
            if (pass !== passConfirm) return showAlert('كلمتا المرور غير متطابقتين');
            if (pass.length < 6) return showAlert('كلمة المرور يجب أن تكون 6 أحرف/أرقام على الأقل');

            auth.createUserWithEmailAndPassword(email, pass).then(res => {
                // إرسال البريد الإلكتروني للتأكيد
                res.user.sendEmailVerification();
                
                db.collection("users").doc(res.user.uid).set({
                    email: email,
                    role: role,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    showAlert('تم إنشاء الحساب! أرسلنا رابط توثيق إلى إيميلك، يرجى تفقده وتفعيل الحساب.', false);
                    setTimeout(() => switchAuthCard('login'), 3500);
                });
            }).catch(err => showAlert(err.message));
        }

        function execResetPassword() {
            const email = document.getElementById('reset-email').value.trim();
            if (!email) return showAlert('أدخل البريد الإلكتروني');
            auth.sendPasswordResetEmail(email).then(() => showAlert('تم إرسال رابط التغيير لبريدك الإلكتروني!', false));
        }

        function execLogout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                db.collection("users").doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        currentUserRole = doc.data().role || 'staff';
                    }
                    renderAppCore();
                });
            } else {
                currentUser = null;
                document.getElementById('auth-container').style.display = 'block';
                document.getElementById('app-container').style.display = 'none';
                document.getElementById('app-nav').style.display = 'none';
            }
        });

        function renderAppCore() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            document.getElementById('app-nav').style.display = 'flex';

            let roleTitle = 'موظف';
            if (currentUserRole === 'owner') roleTitle = 'مالك 👑';
            if (currentUserRole === 'admin') roleTitle = 'مشرف 🛡️';

            document.getElementById('role-badge').innerText = roleTitle;
            listenUsersPresence();
        }

        function listenUsersPresence() {
            db.collection("users").onSnapshot(snap => {
                const list = document.getElementById('users-presence-list');
                list.innerHTML = '';

                snap.forEach(doc => {
                    const u = doc.data();
                    const isMe = doc.id === currentUser.uid;

                    let roleDisplay = 'موظف';
                    if (u.role === 'owner') roleDisplay = 'مالك';
                    if (u.role === 'admin') roleDisplay = 'مشرف';

                    let roleManagement = '';
                    // تغيير الصلاحية وترقية/تنزيل الحسابات (للمالك والمشرف فقط)
                    if ((currentUserRole === 'owner' || currentUserRole === 'admin') && !isMe) {
                        roleManagement = `
                            <div style="margin-top:8px; display:flex; gap:6px; align-items:center;">
                                <span style="font-size:11px; color:var(--text-muted);">تعديل الدور:</span>
                                <select onchange="updateUserRole('${doc.id}', this.value)" style="padding:4px 8px; font-size:11px; width:auto;">
                                    <option value="staff" ${u.role === 'staff' ? 'selected' : ''}>موظف</option>
                                    <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>مشرف</option>
                                    <option value="owner" ${u.role === 'owner' ? 'selected' : ''}>مالك</option>
                                </select>
                            </div>
                        `;
                    }

                    list.innerHTML += `
                        <div class="user-item">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <div style="font-weight:800; font-size:13px;">${u.email} ${isMe ? '(حسابك)' : ''}</div>
                                    <div style="font-size:11px; color:var(--primary); font-weight:700;">الصفة: ${roleDisplay}</div>
                                </div>
                            </div>
                            ${roleManagement}
                        </div>
                    `;
                });
            });
        }

        function updateUserRole(userId, newRole) {
            db.collection("users").doc(userId).update({ role: newRole }).then(() => {
                showAlert('تم تغيير صلاحية المستخدم بنجاح', false);
            });
        }
    </script>
</body>
</html>
